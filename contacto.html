<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colombia Travel - Contacto</title>
</head>
<body>


<header>
    <center>
        <h1>Colombia Travel</h1>
        <nav>
            <font size="5">
                <strong>
                    <a href="index.html">Inicio</a> |
                    <a href="nosotros.html">Nosotros</a> |
                    <a href="destinos.html">Destinos</a> |
                    <a href="planes.html">Planes</a> |
                    <a href="contacto.html">Contacto</a>
                </strong>
            </font>
        </nav>
    </center>
</header>

<hr>


<main>
    <center>
        <h2>Contacto</h2>

        <p>
            <font size="4">
                Completa el siguiente formulario para solicitar información
                sobre nuestros destinos y planes turísticos.
            </font>
        </p>

        <form action="#" method="post">

            <p>
                <label for="nombre">Nombre:</label><br>
                <input type="text" id="nombre" name="nombre" required>
            </p>

            <p>
                <label for="apellido">Apellido:</label><br>
                <input type="text" id="apellido" name="apellido" required>
            </p>

            <p>
                <label for="correo">Correo electrónico:</label><br>
                <input type="email" id="correo" name="correo" required>
            </p>

            <p>
                <label for="telefono">Teléfono:</label><br>
                <input type="tel" id="telefono" name="telefono">
            </p>

            <p>
                <label for="destino">Destino de interés:</label><br>
                <select id="destino" name="destino" required>
                    <option value="">Seleccione un destino</option>
                    <option value="cartagena">Cartagena</option>
                    <option value="eje-cafetero">Eje Cafetero</option>
                    <option value="san-andres">San Andrés</option>
                </select>
            </p>

            <p>
                <label for="mensaje">Mensaje:</label><br>
                <textarea id="mensaje" name="mensaje" rows="6" cols="50" required></textarea>
            </p>

            <p>
                <button type="submit">Enviar</button>
            </p>

        </form>

        <p>
            <font size="4">
                <a href="index.html">Regresar al inicio</a>
            </font>
        </p>
    </center>
</main>


<hr>
<footer>
    <center>
        <p>
            <font size="3">
                &copy; 2026 Colombia Travel. Todos los derechos reservados.
            </font>
        </p>
    </center>
</footer>

</body>
</html>
